name: Bank support request
description: Ask for statements from a bank that isn't read yet
title: "Support <BANK> statements"
labels: ["bank-support"]
body:
  - type: markdown
    attributes:
      value: |
        A parser is written against real statements, so the most useful thing
        you can tell us is what your statements look like — not just which
        bank you use.

        **Never attach a real statement**: it has your account number and
        transaction history in it. Attach a sanitized one instead.

        **The app makes one for you.** Open SpendTrack, click **Help add your
        bank** at the bottom of the sidebar, and pick your statement. It
        rebuilds the PDF keeping the layout and the amounts and dropping the
        identifiers, shows you everything that survived, and gives you a file
        to download. Nothing is uploaded; you attach it here yourself.

        From a clone, the same thing on the command line:

        ```
        uv run python scripts/sanitize_statement.py statement.pdf --redact "YOUR NAME"
        ```

        See [docs/adding-a-bank.md](https://github.com/syoopie/spend-track/blob/main/docs/adding-a-bank.md).
  - type: input
    id: bank
    attributes:
      label: Bank
      placeholder: Standard Chartered / Citibank / Maybank / …
    validations:
      required: true
  - type: checkboxes
    id: statement-types
    attributes:
      label: Which statements
      options:
        - label: Bank account (savings / current)
        - label: Credit card
  - type: dropdown
    id: samples
    attributes:
      label: Can you help test?
      description: Nothing is uploaded anywhere — testing means running the parser on your own machine against your own files.
      options:
        - Yes, I can attach a sanitized sample (the app's "Help add your bank" makes one)
        - Yes, I can run a build locally and report what breaks
        - "No, I'm just registering interest"
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Anything else
      description: e.g. the statement is password-protected, or downloaded from a particular part of the bank's site.
