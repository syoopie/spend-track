name: Desktop build

# Produces the double-clickable download for each OS. PyInstaller freezes
# the interpreter it runs under, so there's no cross-compiling: each
# artifact has to be built on its own runner.
#
# Pushing a tag like v0.1.0 also publishes them as a GitHub Release, which
# is the link the README's "Download" section points at.
#
# Every action here is pinned to a major that runs on Node 24. The GitHub
# runners now force Node-20 actions onto Node 24 and warn about it, and Node
# 20 is removed from runners in September 2026. The lowest node24 major
# differs per action (checkout/setup-node v5, upload-artifact v6,
# download-artifact v7), but the pair of artifact actions is kept on the same
# major deliberately - the release job below depends on download-artifact
# writing each artifact into its own `artifacts/<name>/` directory, which is
# the default only while `merge-multiple` stays false.
#
# Deliberately not run on pull requests: four runners spending a minute
# each on every PR is a lot of machine time for a build whose output nobody
# downloads. The safety net is that `release` needs `build`, so a packaging
# break fails the release run rather than shipping - and the serving layer
# the build depends on is covered by tests/test_webui_serving.py, which
# runs with the ordinary suite. Run this by hand from the Actions tab
# (optionally naming a tag to publish) when packaging changes.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Publish a release at this tag (e.g. v0.1.0). Leave empty to just build."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: SpendTrack-linux-x86_64
            path: backend/dist/SpendTrack
          - os: windows-latest
            artifact: SpendTrack-windows-x86_64
            path: backend/dist/SpendTrack.exe
          # macos-latest is Apple silicon (arm64); macos-15-intel is GitHub's
          # Intel runner. PyInstaller can't cross-compile, so an Intel Mac
          # download needs its own Intel runner - a universal2 binary isn't an
          # option because not every dependency (pydantic-core, cffi) ships a
          # universal2 wheel.
          - os: macos-latest
            artifact: SpendTrack-macos-arm64
            path: backend/dist/SpendTrack.app
          - os: macos-15-intel
            artifact: SpendTrack-macos-x86_64
            path: backend/dist/SpendTrack.app
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Exact version, not a floating major: astral-sh stopped publishing
      # major tags after v7 (there is no `v10`), and their own README pins
      # by SHA for the same reason.
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Build the executable
        working-directory: backend
        run: uv run --group build python scripts/build_desktop.py

      - name: Check it starts and serves the UI
        # A binary that builds but can't start is the failure mode worth
        # catching here - a missing hidden import or data file only shows up
        # at runtime. SPENDTRACK_NO_BROWSER stops it opening a tab on a
        # headless runner; SPENDTRACK_DB_PATH keeps it off the real one.
        shell: bash
        working-directory: backend
        env:
          SPENDTRACK_NO_BROWSER: "1"
        run: |
          export SPENDTRACK_DB_PATH="$RUNNER_TEMP/smoke.db"
          case "${{ runner.os }}" in
            macOS)   ./dist/SpendTrack.app/Contents/MacOS/SpendTrack & ;;
            Windows) ./dist/SpendTrack.exe & ;;
            *)       ./dist/SpendTrack & ;;
          esac
          pid=$!
          fail() { echo "FAILED: $1"; kill $pid 2>/dev/null || true; exit 1; }

          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:8123/api/health > /dev/null && break
            sleep 1
          done || true
          curl -sf http://127.0.0.1:8123/api/health > /dev/null || fail "the packaged app never became reachable"
          echo "API is up"

          # Each of these checks something only the bundle can get wrong, and
          # each has to be able to fail the job - an informational echo would
          # let a build that serves no UI at all upload happily.
          curl -sf http://127.0.0.1:8123/ | grep -qi "<!doctype html" || fail "/ did not serve the UI shell"
          echo "UI shell is served"

          asset=$(curl -sf http://127.0.0.1:8123/ | grep -o '/assets/[^"]*\.js' | head -1)
          [ -n "$asset" ] || fail "the UI shell references no JS bundle"
          curl -sf "http://127.0.0.1:8123$asset" > /dev/null || fail "$asset is missing from the bundle"
          echo "JS bundle is served ($asset)"

          curl -sf http://127.0.0.1:8123/rules | grep -qi "<!doctype html" || fail "deep link /rules did not fall back to the shell"
          echo "Client-side routes resolve"

          curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8123/api/nope | grep -q 404 || fail "an unmatched /api path did not 404"
          echo "Unmatched API paths still 404"

          # reportlab is reached only through the Contribute page's sanitizer,
          # and only at runtime. Nothing else in this job would notice
          # PyInstaller having missed it or one of its font-data hooks.
          sample="../PDF Examples (Sanitized)/UOB/Account Statements/SampleAccountStatement_Feb2024.pdf"
          [ -f "$sample" ] || fail "the sanitizer smoke fixture is missing from the checkout"
          curl -sf -X POST http://127.0.0.1:8123/api/contribute/sanitize \
            -F "file=@$sample" -F "bank=UOB" \
            | grep -q '"pdf_base64": *"' || fail "the sanitizer returned no file - reportlab is probably not bundled"
          echo "The sanitizer runs inside the bundle"

          kill $pid 2>/dev/null || true

      - name: Zip the macOS app bundle
        # A .app is a directory; upload-artifact would flatten it and lose
        # the executable bit, so it's zipped with ditto (which preserves
        # both) before upload.
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent backend/dist/SpendTrack.app backend/dist/SpendTrack-macos.zip

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ runner.os == 'macOS' && 'backend/dist/SpendTrack-macos.zip' || matrix.path }}
          if-no-files-found: error

  release:
    # A pushed v* tag, or a manual run that names one. The manual path exists
    # because a tag can't always be pushed from where the work happens; given
    # a tag name, action-gh-release creates the tag itself (at this run's
    # commit) as well as the release. PR runs stop at the artifacts above.
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: artifacts

      - name: Give each file a name that says what it is
        run: |
          mkdir -p release
          cp artifacts/SpendTrack-linux-x86_64/SpendTrack        release/SpendTrack-linux-x86_64
          cp artifacts/SpendTrack-windows-x86_64/SpendTrack.exe  release/SpendTrack-windows-x86_64.exe
          cp artifacts/SpendTrack-macos-arm64/SpendTrack-macos.zip  release/SpendTrack-macos-arm64.zip
          cp artifacts/SpendTrack-macos-x86_64/SpendTrack-macos.zip release/SpendTrack-macos-x86_64.zip
          ls -lh release

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          files: release/*
          generate_release_notes: true
          body: |
            Download the file for your computer, then see
            [Download and run](https://github.com/syoopie/spend-track#download-and-run)
            for the one-time step macOS and Windows need before an unsigned
            app will open.

            - **Windows** — `SpendTrack-windows-x86_64.exe`
            - **macOS (Apple silicon)** — `SpendTrack-macos-arm64.zip`
            - **macOS (Intel)** — `SpendTrack-macos-x86_64.zip`
            - **Linux** — `SpendTrack-linux-x86_64`
