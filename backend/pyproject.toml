[project]
name = "expenditure-tracker"
version = "0.1.0"
description = "Local-only SG bank statement expenditure tracker"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pdfplumber>=0.11",
    "pypdf>=5.0",
    "python-multipart>=0.0.12",
]

[project.scripts]
expenditure-tracker = "app.main:run"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
