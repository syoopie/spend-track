[project]
name = "spendtrack"
version = "0.1.1"
description = "Local-first bank statement tracker - parsers are per-bank plugins"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pdfplumber>=0.11",
    "pypdf>=5.0",
    "python-multipart>=0.0.12",
]

[project.scripts]
spendtrack = "app.main:run"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "reportlab>=4.0",
]
# Only needed to produce the double-clickable download (scripts/build_desktop.py);
# kept out of `dev` so an ordinary `uv sync` doesn't pull a build toolchain.
build = [
    "pyinstaller>=6.11",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
