[project]
name = "spendtrack"
version = "0.2.2"
description = "Local-first bank statement tracker - parsers are per-bank plugins"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pdfplumber>=0.11",
    "pypdf>=5.0",
    "python-multipart>=0.0.12",
    # Used at runtime by engine/ai_providers/* (every provider's HTTP calls),
    # not just by tests' TestClient - must be a real dependency, not dev-only,
    # or a `uv sync --no-dev`/wheel install can't even start the server.
    "httpx>=0.27",
    # Transitive via pdfplumber -> pdfminer.six (encrypted-PDF support). Capped
    # because cryptography 49+ ships arm64-only macOS wheels: on an Intel macOS
    # runner it then builds from source against Homebrew OpenSSL, and PyInstaller
    # bundles a mismatched libssl that fails at runtime with a missing symbol.
    # 48.x is the last release with a universal2 wheel. Lift this once upstream
    # ships x86_64/universal2 wheels again, or once the Intel build is dropped.
    "cryptography<49",
    # Used at runtime by app/sanitize.py, which draws the sanitized statement
    # a contributor downloads from the Contribute page - not just by the
    # sample generators under scripts/. Dev-only would leave the packaged
    # desktop build unable to run the feature at all.
    "reportlab>=4.0",
]

[project.scripts]
spendtrack = "app.main:run"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "app"

[dependency-groups]
dev = [
    "pytest>=8.3",
]
# Only needed to produce the double-clickable download (scripts/build_desktop.py);
# kept out of `dev` so an ordinary `uv sync` doesn't pull a build toolchain.
build = [
    "pyinstaller>=6.11",
]

[tool.pytest.ini_options]
# `scripts` is on the path so tests can import the contributor-facing tools
# (sanitize_statement, the sample generators) directly. They are scripts
# rather than package modules on purpose - a contributor runs them from a
# clone without installing anything - but the redaction rules in
# sanitize_statement are exactly the kind of thing that must not go untested.
pythonpath = ["src", "scripts"]
